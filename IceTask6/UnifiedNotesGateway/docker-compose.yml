
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: notes-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - azurite_data:/data

  notes-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-api
    environment:
      AzureWebJobsStorage: "UseDevelopmentStorage=true"
      AzureBlobStorage: "UseDevelopmentStorage=true"
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      Jwt__Secret: "${JWT_SECRET:?Set JWT_SECRET in your environment}"
      Jwt__Issuer: "UnifiedNotesAPI"
      Jwt__Audience: "UnifiedNotesAPI"
    depends_on:
      - azurite
    ports:
      - "7071:80"

  api-gateway:
    build:
      context: ./UnifiedNotesGateway
      dockerfile: Dockerfile
    container_name: unified-notes-gateway
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Jwt__Secret: "${JWT_SECRET:?Set JWT_SECRET in your environment}"
      Jwt__Issuer: "UnifiedNotesAPI"
      Jwt__Audience: "UnifiedNotesAPI"
      NotesApi__BaseUrl: "http://notes-api:80/"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      - notes-api
    ports:
      - "8080:8080"

volumes:
  azurite_data:
