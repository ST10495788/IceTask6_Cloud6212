services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - azurite_data:/data

  notes-api:
    build:
      context: ../IceTask6_Cloud6212
      dockerfile: Dockerfile
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      AzureBlobStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      Jwt__Secret: "${JWT_SECRET:?Set JWT_SECRET before starting Compose}"
      Jwt__Issuer: "UnifiedNotesAPI"
      Jwt__Audience: "UnifiedNotesAPI"
    depends_on:
      - azurite
    ports:
      - "7071:80"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__Secret: "${JWT_SECRET:?Set JWT_SECRET before starting Compose}"
      Jwt__Issuer: "UnifiedNotesAPI"
      Jwt__Audience: "UnifiedNotesAPI"
      NotesApi__BaseUrl: "http://notes-api:80/"
    depends_on:
      - notes-api
    ports:
      - "8080:8080"

volumes:
  azurite_data:
